<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="臺大管理學 2026 第五週「規劃與策略規劃」課堂模擬：澄川電控的三次選擇。A classroom strategy simulation for Week 5, Planning and Strategic Planning.">
<title>W5 澄川電控的三次選擇｜規劃與策略規劃</title>
<style>
:root{
  color-scheme:light;
  --navy:#002B5C;--navy-700:#0B3A75;--navy-300:#7F95B5;--navy-100:#E1E8F2;--navy-50:#F2F5FA;
  --gold:#C9A227;--gold-700:#8A6D0F;--gold-100:#F8F0D0;
  --bg:#EDF0F5;--surface:#FFFFFF;--ink:#12203A;--ink-2:#414E68;--muted:#667189;
  --line:#D2D9E5;--line-2:#E7EBF2;
  --ok:#1C7446;--bad:#B3261E;--bad-50:#FCEEEC;--warn:#8A5A00;
  --dh:#2a78d6;--dc:#4a3aa7;--th:#eb6834;--tc:#1baf7a;
  --in:#B8901A;--out:#8FA3BF;
  --font:"Noto Sans TC","PingFang TC","Microsoft JhengHei","Heiti TC",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:120px}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.75 var(--font);-webkit-text-size-adjust:100%}
html[lang=en] body{line-height:1.6}
button,input,textarea,select{font:inherit;color:inherit}
h1,h2,h3,h4,p,ul,ol{margin:0}
a{color:var(--navy-700)}
img,svg{max-width:100%}

/* ---------- 版頭與導覽 ---------- */
.top{position:sticky;top:0;z-index:30;background:var(--navy);color:#fff}
.top-in{max-width:1180px;margin:auto;padding:10px 20px;display:flex;align-items:center;gap:18px}
.brand{line-height:1.3;min-width:0}
.brand small{display:block;font-size:13px;color:#C7D3E6}
.brand strong{font-size:17px;font-weight:600;white-space:nowrap}
.track{margin-left:auto;display:flex;align-items:center;gap:0;font-size:13px;color:#C7D3E6}
.track .stop{display:flex;align-items:center;gap:7px}
.track .lamp{width:14px;height:14px;border-radius:50%;border:2px solid #7F95B5;background:transparent}
.track .stop.done .lamp{background:var(--gold);border-color:var(--gold)}
.track .stop.now .lamp{border-color:var(--gold);box-shadow:0 0 0 4px rgba(201,162,39,.28)}
.track .stop.now,.track .stop.done{color:#fff}
.track .wire{width:34px;height:2px;background:#52699A;margin:0 8px}
.track .wire.done{background:var(--gold)}
.lang{border:1px solid #7F95B5;background:transparent;color:#fff;border-radius:6px;padding:6px 12px;cursor:pointer;font-size:15px;white-space:nowrap}
.lang:hover{border-color:#fff}
.tabs{background:var(--surface);border-bottom:1px solid var(--line)}
.tabs-in{max-width:1180px;margin:auto;padding:0 12px;display:flex;gap:2px;overflow-x:auto;scrollbar-width:thin}
.tabs button{border:0;background:none;padding:12px 14px 10px;border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap;color:var(--ink-2);font-size:16px}
.tabs button:hover:not(:disabled){color:var(--navy)}
.tabs button[aria-current=true]{color:var(--navy);border-bottom-color:var(--gold);font-weight:600}
.tabs button:disabled{color:#A3ACBD;cursor:not-allowed}

/* ---------- 版面 ---------- */
main{max-width:1180px;margin:auto;padding:30px 20px 90px}
.prose{max-width:43em}
h1:focus,h2:focus{outline:none}
h1{font-size:clamp(28px,3.6vw,40px);line-height:1.25;font-weight:700;color:var(--navy);margin:6px 0 14px;letter-spacing:.01em}
h2{font-size:24px;line-height:1.4;font-weight:700;color:var(--navy);margin:0 0 10px}
h3{font-size:19px;line-height:1.45;font-weight:600;margin:0 0 6px}
p+p{margin-top:.7em}
.lead{font-size:19px;color:var(--ink)}
.kicker{font-size:15px;color:var(--gold-700);font-weight:600}
.muted{color:var(--muted)}
.small{font-size:15px}
.sec{margin-top:44px}
.sec>h2{padding-top:18px;border-top:2px solid var(--navy)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.stack>*+*{margin-top:14px}
ul.plain{list-style:none;padding:0}
ul.rules{list-style:none;padding:0;display:grid;gap:10px}
ul.rules li{display:grid;grid-template-columns:10.5em 1fr;gap:14px;padding:12px 16px;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--navy);border-radius:6px}
ul.rules li strong{color:var(--navy)}

/* ---------- 按鈕與表單 ---------- */
.btn{cursor:pointer;border:1px solid var(--navy-300);background:var(--surface);color:var(--navy);border-radius:6px;padding:9px 16px;font-weight:500}
.btn:hover:not(:disabled){border-color:var(--navy);background:var(--navy-50)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--navy);border-color:var(--navy);color:#fff;font-weight:600;padding:11px 22px}
.btn.primary:hover:not(:disabled){background:var(--navy-700)}
.btn.small{padding:5px 12px;font-size:15px}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,summary:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
label.field{display:block;font-weight:600;margin:18px 0 4px}
.hint{color:var(--muted);font-size:15px}
textarea,select{display:block;width:100%;border:1px solid #B6C0D1;border-radius:6px;background:#fff;padding:11px 12px}
textarea{min-height:92px;resize:vertical;line-height:1.65}
textarea.bad{border-color:var(--bad);background:var(--bad-50)}
.count{font-size:14px;color:var(--muted);text-align:right;margin-top:2px}
.count.short{color:var(--bad)}
.inline-err{color:var(--bad);font-weight:600;margin-top:10px}
.inline-err:empty{display:none}
details{margin-top:14px}
summary{cursor:pointer;font-weight:600;color:var(--navy-700)}
details>*:not(summary){margin-top:10px}

/* 模式標籤（課綱用語） */
.mode{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;letter-spacing:.04em;border-radius:4px;padding:2px 8px;vertical-align:middle;margin-left:8px}
.mode.noai{background:var(--navy-100);color:var(--navy)}
.mode.ai{background:var(--gold-100);color:#6B5406}

/* ---------- 開場 ---------- */
.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:28px;align-items:center}
.hero-fig{background:var(--navy);border-radius:12px;padding:14px}
.facts{display:grid;grid-template-columns:repeat(4,1fr);gap:0;border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden}
.facts div{padding:16px 18px;border-right:1px solid var(--line-2)}
.facts div:last-child{border-right:0}
.facts dt{font-size:14px;color:var(--gold-700);font-weight:700}
.facts dd{margin:4px 0 0;font-size:16px;line-height:1.6}
.voices{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.voice{display:grid;grid-template-columns:46px 1fr;gap:12px;align-items:start}
.avatar{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-weight:700;color:#fff;background:var(--navy);font-size:17px}
.avatar.b{background:#5B6F92}.avatar.c{background:var(--gold-700)}.avatar.d{background:#3D5A80}
.voice .who{font-size:14px;color:var(--muted)}
.voice blockquote{margin:2px 0 0;padding:10px 14px;background:var(--surface);border:1px solid var(--line);border-radius:2px 12px 12px 12px;font-size:16px;line-height:1.65}
table{border-collapse:collapse;width:100%;font-size:16px}
th,td{border:1px solid var(--line);padding:10px 12px;text-align:left;vertical-align:top}
th{background:var(--navy-50);color:var(--navy);font-weight:600}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.tablewrap{overflow-x:auto;background:var(--surface);border-radius:8px}
.levels th:first-child,.levels td:first-child{width:7.5em;font-weight:600;background:var(--navy-50);color:var(--navy)}
.levels td.hl,.levels th.hl{background:var(--gold-100)}
.methods{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.method svg{margin-bottom:8px}
.method h3 small{font-weight:400;color:var(--muted);font-size:15px}

/* 暖身 */
.warm{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.wcard{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px}
.wcard p{font-weight:500}
.wcard .choices{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.wcard .choices button{font-size:15px;padding:4px 12px;border-radius:999px;border:1px solid var(--navy-300);background:#fff;cursor:pointer;color:var(--navy)}
.wcard .choices button:hover:not(:disabled){background:var(--navy-50)}
.wcard .choices button.pick{background:var(--navy);color:#fff;border-color:var(--navy)}
.wcard .choices button:disabled{cursor:default}
.wcard .fb{font-size:15px;margin-top:8px;color:var(--ink-2)}
.wcard.right{border-left:4px solid var(--ok)}
.wcard.wrong{border-left:4px solid var(--bad)}
.wcard .mark{font-weight:700}
.wcard.right .mark{color:var(--ok)}.wcard.wrong .mark{color:var(--bad)}

/* 指標磚 */
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:0;background:var(--surface);border:1px solid var(--line);border-top:3px solid var(--navy);border-radius:0 0 10px 10px}
.tile{padding:14px 18px;border-right:1px solid var(--line-2)}
.tile:last-child{border-right:0}
.tile .lab{font-size:14px;color:var(--muted)}
.tile .val{font-size:30px;font-weight:700;color:var(--navy);line-height:1.25}
.tile .sub{font-size:14px;color:var(--muted)}
.tile svg{display:block;margin-top:4px}

/* 情境矩陣 */
.matrix{display:grid;grid-template-columns:auto 1fr 1fr;grid-template-rows:auto 1fr 1fr;gap:8px;max-width:760px}
.matrix .ylab{grid-column:1;width:4.2em;align-self:center;text-align:right;font-size:14px;line-height:1.4;color:var(--ink-2);font-weight:600}
.matrix .xhead,.matrix .yhead{font-size:14px;color:var(--ink-2);font-weight:600;text-align:center}
.matrix .corner{grid-row:1;grid-column:1}
.quad{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px;text-align:left;min-height:108px;position:relative;font:inherit;color:inherit;display:flex;flex-direction:column;justify-content:flex-start;align-items:flex-start;width:100%}
.quad h4{font-size:17px;display:flex;align-items:center;gap:8px}
.quad h4 i{width:12px;height:12px;border-radius:3px;flex:none}
.quad p{font-size:15px;color:var(--ink-2);line-height:1.55;margin-top:4px}
button.quad{cursor:pointer}
button.quad:hover:not(:disabled){border-color:var(--navy)}
.quad.sel{border:2px solid var(--navy);padding:11px 13px;background:var(--navy-50)}
.quad.actual::after{content:attr(data-badge);position:absolute;top:-10px;right:10px;background:var(--gold);color:#3A2E05;font-size:13px;font-weight:700;padding:1px 8px;border-radius:999px}
.quad .tag{display:inline-block;font-size:13px;font-weight:700;color:var(--navy);background:var(--navy-100);border-radius:999px;padding:0 8px;margin-top:6px}
.matrix.mini{max-width:none;gap:4px;grid-template-columns:1fr 1fr;grid-template-rows:auto}
.matrix.mini .quad{min-height:0;padding:10px 8px 6px;font-size:14px;border-radius:5px;display:block}

/* 回推時間軸 */
.back{display:grid;grid-template-columns:repeat(3,1fr);gap:0 24px}
.back .col{grid-row:1;min-width:0}
.back .c1{grid-column:1}.back .c2{grid-column:2}.back .c3{grid-column:3}
.back .yr{display:flex;align-items:center;gap:10px;font-size:22px;font-weight:700;color:var(--navy)}
.back .yr span{font-size:14px;font-weight:600;color:#fff;background:var(--navy);border-radius:999px;width:24px;height:24px;display:grid;place-items:center}
.back .arrow{height:26px;margin:6px 0 2px}
.back .arrow svg{width:100%;height:26px;display:block}
.back label.field{margin-top:6px}

/* ---------- 回合頁 ---------- */
.roundgrid{display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:26px;align-items:start}
.roundgrid>div{min-width:0}
.panel{position:sticky;top:112px;background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--gold);border-radius:8px;padding:16px 16px 14px;box-shadow:0 6px 18px rgba(0,43,92,.08)}
.panel h3{font-size:16px;color:var(--navy)}
.meter{margin-top:12px}
.meter .row{display:flex;justify-content:space-between;font-size:15px}
.meter .row b{font-variant-numeric:tabular-nums}
.bar{height:12px;border-radius:6px;background:var(--navy-100);overflow:hidden;margin-top:4px;display:flex}
.bar i{display:block;height:100%;background:var(--navy);transition:width .35s ease}
.bar i.over{background:var(--bad)}
.slots{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;margin-top:5px}
.slots i{height:22px;border-radius:4px;border:1.5px solid var(--navy-300);background:#fff;transition:background .25s,border-color .25s}
.slots i.on{background:var(--navy);border-color:var(--navy)}
.slots i.over{background:var(--bad);border-color:var(--bad)}
.panel dl{margin:12px 0 0;font-size:15px;display:grid;grid-template-columns:1fr auto;gap:3px 10px}
.panel dt{color:var(--ink-2)}.panel dd{margin:0;text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.panel .status{margin-top:12px;font-size:15px;font-weight:600;padding:8px 10px;border-radius:6px;background:var(--navy-50);color:var(--navy)}
.panel .status.err{background:var(--bad-50);color:var(--bad)}
.signals{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.signal{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--gold);border-radius:6px;padding:10px 14px}
.signal .src{font-size:13px;font-weight:700;color:var(--gold-700)}
.signal p{font-size:16px;line-height:1.6}
.econ{background:var(--navy-50);border-radius:8px;padding:12px 16px;font-size:16px}
.group-h{display:flex;align-items:baseline;gap:10px;margin:22px 0 10px}
.group-h h3{margin:0;color:var(--navy)}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.action{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px 16px;transition:border-color .2s,box-shadow .2s}
.action.selected{border-color:var(--navy);box-shadow:inset 0 0 0 1px var(--navy)}
.action.locked{background:#F4F6F9}
.action.locked .a-name{color:var(--ink-2)}
.action label{display:flex;gap:12px;align-items:flex-start;cursor:pointer}
.action.locked label{cursor:not-allowed}
.action input{margin-top:5px;width:20px;height:20px;flex:none;accent-color:var(--navy)}
.a-name{font-weight:600;line-height:1.45}
.a-desc{font-size:15px;color:var(--ink-2);line-height:1.6;margin-top:2px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{font-size:14px;border-radius:999px;padding:1px 10px;background:var(--navy-50);border:1px solid var(--line);color:var(--ink);white-space:nowrap}
.chip.gain{background:var(--gold-100);border-color:#E7D8A0}
.chip.ok{border-color:#A9D3BD;background:#EEF7F2;color:var(--ok)}
.chip.no{border-color:#E6B8B3;background:var(--bad-50);color:var(--bad)}
.lock-why{font-size:15px;color:var(--bad);font-weight:600;margin-top:8px}
.pay{margin-top:10px;font-size:14px}
.pay .ptitle{color:var(--muted)}
.pay .prow{display:grid;grid-template-columns:8.2em 1fr 2.2em;gap:8px;align-items:center;margin-top:3px}
html[lang=en] .pay .prow{grid-template-columns:12.5em 1fr 2.2em}
.pay .pname{white-space:nowrap;display:flex;align-items:center;gap:6px}
.pay .pname i{width:9px;height:9px;border-radius:2px;flex:none}
.pay .pbar{height:8px;background:var(--line-2);border-radius:4px;overflow:hidden}
.pay .pbar i{display:block;height:100%;border-radius:0 4px 4px 0}
.pay .pval{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:0;margin:8px 0 4px;padding:0}
.steps li{list-style:none;padding:10px 14px;background:var(--surface);border:1px solid var(--line);border-right-width:0;font-size:15px;line-height:1.5;color:var(--muted)}
.steps li:first-child{border-radius:8px 0 0 8px}.steps li:last-child{border-right-width:1px;border-radius:0 8px 8px 0}
.steps li b{display:block;color:var(--ink-2);font-size:16px}
.steps li.now{background:var(--navy);border-color:var(--navy);color:#DCE5F2}
.steps li.now b{color:#fff}
.steps li.done b::after{content:" ✓";color:var(--ok)}
.prompt{white-space:pre-wrap;font:15px/1.7 var(--font);padding:16px;background:#F3F5F9;border:1px solid var(--line);border-radius:6px;max-height:380px;overflow:auto;margin:10px 0}
.diff{font-size:16px;padding:10px 14px;border-radius:6px;background:var(--gold-100)}
.t0box{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px 18px}
.checkline{display:flex;gap:10px;align-items:flex-start;margin-top:12px}
.checkline input{width:20px;height:20px;margin-top:4px;flex:none;accent-color:var(--navy)}

/* ---------- 圖表共用 ---------- */
.fig{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 18px;min-width:0}
.settle>*,.grid2>*,.lab-grid>*,.insights>*{min-width:0}
.fig h3{font-size:17px;color:var(--navy)}
.fig .cap{font-size:15px;color:var(--muted);margin-top:8px;max-width:46em}
.fig>svg,.fig .scroll-x>svg,.method>svg{display:block;width:100%;height:auto}
.fig svg.chart{max-width:720px}
.fig .scroll-x>svg.tree{max-width:800px}
.legend svg{width:16px;height:16px;flex:none}
.scroll-x{overflow-x:auto}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:14px;color:var(--ink-2);margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{display:inline-block;width:14px;height:14px;border-radius:3px;flex:none}
.legend i.line{height:3px;border-radius:2px;width:18px}
svg text{font-family:var(--font)}
.ax{fill:var(--muted);font-size:12.5px}
.vl{fill:var(--ink);font-size:13px;font-weight:600}
.grid-l{stroke:var(--line-2);stroke-width:1}
.base-l{stroke:#B6C0D1;stroke-width:1}
#tip{position:fixed;z-index:60;pointer-events:none;background:var(--ink);color:#fff;font-size:14px;line-height:1.5;padding:7px 10px;border-radius:6px;max-width:300px;white-space:pre-line;opacity:0;transition:opacity .12s;box-shadow:0 6px 16px rgba(0,0,0,.2)}
#tip.on{opacity:1}

/* 能力路徑圖 */
.capmap{min-width:700px}
.capmap .hd{fill:var(--navy);font-size:15.5px;font-weight:700}
.capmap .hd2{fill:var(--muted);font-size:13px}
.capmap .wire{fill:none;stroke:#C5CEDD;stroke-width:2}
.capmap .wire.live{stroke:var(--navy);stroke-width:2.5}
.capmap .flow{fill:none;stroke:var(--gold);stroke-width:2.5;stroke-dasharray:3 13;stroke-linecap:round;animation:flow 1.1s linear infinite}
.capmap .node rect{fill:#fff;stroke:#B6C0D1;stroke-width:1.5}
.capmap .node text.nm{fill:var(--ink-2);font-size:15px;font-weight:600}
.capmap .node text.st{fill:var(--muted);font-size:12.5px}
html[lang=en] .capmap .node text.nm{font-size:14px}
html[lang=en] .capmap .node text.st{font-size:12px}
.capmap .node .lamp{fill:#fff;stroke:#9AA6BA;stroke-width:2}
.capmap .node.on rect{stroke:var(--navy);stroke-width:2;fill:var(--navy-50)}
.capmap .node.on .lamp{fill:var(--gold);stroke:var(--gold-700)}
.capmap .node.on text.nm{fill:var(--navy)}
.capmap .node.half .lamp{fill:url(#halfLamp);stroke:var(--gold-700)}
.capmap .node.pending rect{stroke:var(--gold-700);stroke-width:2;stroke-dasharray:6 4}
.capmap .node.pending .lamp{fill:var(--gold-100);stroke:var(--gold-700);animation:pulse 1.4s ease-in-out infinite}
.capmap .node.planned rect{stroke:var(--navy);stroke-dasharray:3 4;stroke-width:2}
.capmap .node.planned .lamp{stroke:var(--navy)}
.capmap .node.open rect{fill:var(--navy);stroke:var(--navy)}
.capmap .node.open text.nm{fill:#fff}

.draw .ln{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.1s ease forwards}
.draw .ah{opacity:0;animation:fade .3s ease 1s forwards}

.signal.in{animation:slide .45s ease both}

.pathline .pcol:last-child{border-right-width:1px;border-radius:0 10px 10px 0}

.pathline .py{font-weight:700;color:var(--navy);font-size:18px;display:flex;justify-content:space-between;align-items:baseline}
.pathline .py small{font-weight:500;color:var(--muted);font-size:14px}
.pchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.pchip{font-size:14px;border-radius:5px;padding:2px 9px;background:var(--navy);color:#fff}
.pchip.build{background:#fff;color:var(--navy);border:1.5px solid var(--navy)}
.pchip.none{background:#fff;color:var(--muted);border:1.5px dashed var(--navy-300)}
.pchip.drop{background:#fff;color:var(--muted);border:1.5px solid var(--line);text-decoration:line-through}

/* 成果頁 */
.toc{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.toc a{font-size:15px;text-decoration:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 14px;color:var(--navy)}
.toc a:hover{border-color:var(--navy)}
.hbars{display:grid;gap:10px;margin-top:10px}
.hbar{display:grid;grid-template-columns:12.5em 1fr 3.2em;gap:10px;align-items:center;font-size:15px}
html[lang=en] .hbar{grid-template-columns:15em 1fr 3.2em}
.hbar .trk{height:18px;display:flex;gap:2px}
.hbar .trk i{display:block;height:100%;border-radius:0 4px 4px 0;background:var(--navy);min-width:2px}
.hbar .trk i.alt{background:var(--navy-300)}
.hbar .trk i.ext{background:var(--gold)}
.hbar b{text-align:right;font-variant-numeric:tabular-nums}
.hbar.me .nm{font-weight:700;color:var(--navy)}
.insights{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.insight{background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--navy);border-radius:0 0 10px 10px;padding:16px 18px}
.insight h3{color:var(--navy)}
.insight .fact{margin-top:8px;padding:10px 12px;background:var(--gold-100);border-radius:6px;font-size:16px}

.beliefs{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.belief h4{font-size:16px;color:var(--navy);margin-bottom:6px}
.lab-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.lab-col{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px}
.lab-col h4{font-size:16px;color:var(--navy);display:flex;justify-content:space-between}
.lab-col h4 small{font-weight:500;color:var(--muted);font-size:14px}
.lab-col.dead{opacity:.5}
.lab-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.lab-chips button{font-size:14px;border-radius:5px;padding:3px 9px;border:1.5px solid var(--navy-300);background:#fff;color:var(--navy);cursor:pointer}
.lab-chips button[aria-pressed=true]{background:var(--navy);color:#fff;border-color:var(--navy)}
.lab-chips button:disabled{border-style:dashed;color:#9AA6BA;border-color:var(--line);cursor:not-allowed}
.lab-sum{font-size:14px;color:var(--ink-2);margin-top:8px}
.lab-sum.err{color:var(--bad);font-weight:600}
.seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--navy-300);border-radius:6px;overflow:hidden}
.seg button{border:0;background:#fff;padding:6px 12px;cursor:pointer;font-size:15px;color:var(--navy);border-right:1px solid var(--line)}

.seg button[aria-pressed=true]{background:var(--navy);color:#fff}

.tree .tn text{font-size:13px;fill:var(--ink)}
.tree .tn text.v{font-weight:700;font-size:14px}

.tree .te.best{stroke:var(--gold);stroke-width:4}
.tree .te.cut{stroke:#D9DEE8;stroke-dasharray:4 5}
.tree .el{font-size:12.5px;fill:var(--ink-2);paint-order:stroke;stroke:#fff;stroke-width:5px;stroke-linejoin:round}
.tree .tn.solved rect{fill:var(--gold-100);stroke:var(--gold-700);stroke-width:2}

.flow{display:flex;height:44px;border-radius:6px;overflow:hidden;margin-top:6px;gap:2px}
.flow i{display:grid;place-items:center;font-style:normal;font-size:13px;color:#fff;background:var(--navy);min-width:0;overflow:hidden;white-space:nowrap}

.sharelink code{background:#F3F5F9;border:1px solid var(--line);border-radius:6px;padding:6px 10px;font-size:14px;word-break:break-all;flex:1;min-width:220px}

/* 頁尾、提示 */
footer{max-width:1180px;margin:auto;padding:0 20px 40px;font-size:14px;color:var(--muted)}
.backup{margin-top:56px;padding-top:18px;border-top:1px solid var(--line)}

#toast{position:fixed;left:0;right:0;margin:0 auto;width:fit-content;bottom:26px;transform:translateY(20px);z-index:70;background:var(--ink);color:#fff;padding:12px 18px;border-radius:8px;font-size:16px;max-width:min(92vw,560px);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;box-shadow:0 10px 26px rgba(0,0,0,.25)}
#toast.on{opacity:1;transform:none}
.swipe{display:none;font-size:13px;color:var(--muted);margin:4px 0 0}
#toast.err{background:var(--bad)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- 響應式 ---------- */
@media(max-width:1020px){

  .back{grid-template-columns:1fr;gap:6px}
  .back .col,.back .c1,.back .c2,.back .c3{grid-column:1;grid-row:auto}
  .back .arrow{display:none}
  .steps,.pathline{grid-template-columns:1fr}
  .steps li,.steps li:first-child,.steps li:last-child{border-right-width:1px;border-radius:0;border-bottom-width:0}
  .steps li:first-child{border-radius:8px 8px 0 0}.steps li:last-child{border-radius:0 0 8px 8px;border-bottom-width:1px}
  .pathline .pcol,.pathline .pcol:first-child,.pathline .pcol:last-child{border-right-width:1px;border-radius:0;min-height:0}
  .pathline .pcol+.pcol{border-top-width:0}
  ul.rules li{grid-template-columns:1fr;gap:2px}
  .top-in{flex-wrap:wrap;gap:8px 14px;padding:8px 16px}
  .track{order:3;margin-left:0;width:100%;justify-content:flex-start}
  .lang{margin-left:auto}
  main{padding:22px 16px 80px}
  .lead{font-size:18px}
  .hbar,html[lang=en] .hbar{grid-template-columns:1fr 3em;row-gap:2px}
  .hbar .nm{grid-column:1/3}
  .matrix{grid-template-columns:auto 1fr 1fr}
  .quad{min-height:0;padding:10px}
  .quad h4{font-size:16px}
  .quad p{font-size:14px}
  .matrix .ylab{width:3.3em;font-size:13px}

  .swipe{display:block}
  .board{grid-template-columns:1fr}
  table{min-width:560px}
  html{scroll-padding-top:150px}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  html{scroll-behavior:auto}
  .draw .ln{stroke-dashoffset:0}
  .draw .ah{opacity:1}
}
@media print{
  .top,.tabs,.toolbar,.btn,footer,.panel,#toast,.backup,.swipe{display:none!important}
  body{background:#fff}
  main{padding:0;max-width:none}
  .action,.fig,.card{break-inside:avoid}
  .prompt{max-height:none}
}

function payoff(action, world) {
  const w = W[world];
  switch (action.pay) {
    case 'service': return w.hot ? 22 : 16;
    case 'platform': return w.ai ? (w.hot ? 54 : 28) : (w.hot ? 18 : 10);
    case 'module': return w.hot ? 36 : 22;
    case 'maintenance': return w.hot ? 28 : 34;
    case 'coop': return w.ai ? (w.hot ? 20 : 16) : (w.hot ? 28 : 22);
    default: return 0;
  }
}

function mature(sim, r) {
  const left = [];

    if (p.ready <= r) { for (const [k, v] of Object.entries(p.gain)) sim.caps[k] += v; }

  return sim;
}

function eligible(a, sim) {
  if (!a.repeat && sim.done.includes(a.id)) return tr('已投資過，不能重複', 'Already built; cannot be repeated');
  for (const [k, v] of Object.entries(a.req || {})) {
    if (sim.caps[k] < v) return tr('尚缺已成熟的「' + capText(k, v) + '」', 'Needs matured “' + capText(k, v) + '”');
  }
  return '';
}
function totals(ids) {
  const acts = ids.map(id => ACT[id]);
  return { cost: acts.reduce((s, a) => s + a.cost, 0), eng: acts.reduce((s, a) => s + a.eng, 0) };
}
function check(ids, sim) {
  if (!Array.isArray(ids) || new Set(ids).size !== ids.length || ids.some(id => !own(ACT, id))) return 'invalid';
  const { cost, eng } = totals(ids);
  if (cost > sim.cash) return tr('現金不足。本回合投入 ' + cost + '，可用現金只有 ' + sim.cash + '；回合末的收入不能預支。', 'Not enough cash. This round’s spending is ' + cost + ' but only ' + sim.cash + ' is available, and round-end revenue cannot be spent in advance.');
  if (eng > ENG_CAP) return tr('工程人力超過上限。已安排 ' + eng + ' 單位，每回合只有 ' + ENG_CAP + ' 單位。', 'Engineering capacity exceeded. ' + eng + ' units are assigned, but each round has only ' + ENG_CAP + '.');
  for (const id of ids) { const why = eligible(ACT[id], sim); if (why) return T(ACT[id].name) + COLON() + why; }
  return '';
}
function execute(sim, ids, r, world) {
  const err = check(ids, sim);
  if (err) throw Error(err);
  const before = clone(sim);
  let cost = 0, revenue = 0, eng = 0, tended = false;
  const built = [], sold = [];
  for (const id of ids) {
    const a = ACT[id];
    cost += a.cost; eng += a.eng;
    if (a.pay) { const p = payoff(a, world); revenue += p; sold.push({ id, pay: p }); }
    if (a.gain) {
      if (a.delay) { sim.pending.push({ id: a.id, gain: a.gain, ready: r + 1 }); built.push(id); }
      else { for (const [k, v] of Object.entries(a.gain)) sim.caps[k] += v; if (a.gain.relation) tended = true; }
    }
    if (!a.repeat) sim.done.push(a.id);
  }
  if (!tended) sim.caps.relation = Math.max(0, sim.caps.relation - RELATION_DECAY);
  const base = W[world].hot ? BASE.hot : BASE.cold;
  const shock = PRESSURE[r - 1] || 0;
  sim.cash += base + revenue - cost - shock;
  sim.spent += cost;
  return { r, sim, before, cost, revenue, eng, base, shock, built, sold, relDelta: sim.caps.relation - before.caps.relation, after: clone(sim) };
}
/* picks：每回合所選行動 id 的陣列。某回合不可行時丟出錯誤。 */
function simulate(picks, world) {
  const sim = startSim(), ledger = [];
  for (let i = 0; i < picks.length; i++) { mature(sim, i + 1); ledger.push(execute(sim, picks[i], i + 1, world)); }
  return { sim, ledger };
}
/* 與 simulate 相同，但不丟錯：回傳在第幾回合失敗 */
function trySimulate(picks, world) {
  const sim = startSim(), ledger = [];
  for (let i = 0; i < picks.length; i++) {
    mature(sim, i + 1);
    try { ledger.push(execute(sim, picks[i], i + 1, world)); }
    catch (e) { return { sim, ledger, failAt: i + 1, error: e.message }; }
  }
  return { sim, ledger, failAt: 0, error: '' };
}

function openActions(sim) { return A.filter(a => !eligible(a, sim)); }
/* 延伸試算：若再多一回合（2032），以屆時成熟的能力，在現金與人力限制內可取得的最大行動淨收入 */
function bestExtension(simEnd, world) {
  const sim = mature(clone(simEnd), 4);
  const ok = A.filter(a => a.pay && !eligible(a, sim));
  let best = { net: 0, ids: [] };
  for (let m = 1; m < (1 << ok.length); m++) {
    const ids = ok.filter((_, i) => (m >> i) & 1).map(a => a.id);
    const t = totals(ids);
    if (t.cost > sim.cash || t.eng > ENG_CAP) continue;
    const net = ids.reduce((s, id) => s + payoff(ACT[id], world) - ACT[id].cost, 0);
    if (net > best.net) best = { net, ids };
  }
  return { ...best, caps: sim.caps };
}

/* 現金瀑布圖：期初 − 投入 + 基本營運 + 行動收入 − 成本壓力 = 期末 */
function waterfall(x) {
  const steps = [

    { l: tr('本回合\n投入', 'Spending'), d: -x.cost },

    { l: tr('回合末\n現金', 'Round-end\ncash'), total: x.after.cash }

  let run = 0, peak = 0;
  for (const s of steps) { if (s.total != null) { s.lo = 0; s.hi = s.total; run = s.total; } else { s.lo = Math.min(run, run + s.d); s.hi = Math.max(run, run + s.d); run += s.d; } s.end = run; peak = Math.max(peak, s.hi); }

  const y = v => B - (v / top) * (B - T0);

  const bars = steps.map((s, i) => {
    const cx = L + slot * (i + .5), isTotal = s.total != null, zero = !isTotal && s.d === 0;
    const hgt = Math.max(zero ? 2 : 3, y(s.lo) - y(s.hi)), fill = isTotal ? 'var(--navy)' : (s.d > 0 ? 'var(--in)' : 'var(--out)');
    const lab = isTotal ? String(s.total) : (s.d > 0 ? '+' + s.d : s.d < 0 ? '−' + Math.abs(s.d) : '0');

  if (shape === 2) return `<path d="M${x},${y - s - 1.5} L${x + s + 1},${y + s} L${x - s - 1},${y + s} z" fill="${c}" stroke="#fff" stroke-width="2"/>`;

function cashLine(series, opts = {}) {

  const paths = series.map((s, k) => `<path class="ln" pathLength="1" style="animation-delay:${k * .15}s" d="${s.values.map((v, i) => (i ? 'L' : 'M') + x(i) + ',' + y(v)).join(' ')}" fill="none" stroke="${s.color}" stroke-width="${s.wide ? 7 : 2.5}" stroke-linejoin="round" stroke-linecap="round"/>`).join('');
  const marks = series.map((s, k) => s.values.map((v, i) => marker(s.shape ?? k, x(i), y(v), s.color)).join('') + (s.fail ? (() => { const i = s.values.length - 1, px = x(i) + 16, py = y(s.values[i]); return `<path d="M${px - 5},${py - 5} L${px + 5},${py + 5} M${px + 5},${py - 5} L${px - 5},${py + 5}" stroke="var(--bad)" stroke-width="2.5" stroke-linecap="round"/>`; })() : '')).join('');

  } else {

    for (let i = 1; i < ends.length; i++) if (ends[i].ly - ends[i - 1].ly < 16) ends[i].ly = ends[i - 1].ly + 16;

function spark(vals) {

/* 有限決策樹：逆向歸納的逐步求解 */
function treeData(world) {
  const net = id => payoff(ACT[id], world) - ACT[id].cost;
  const P = { sale: net('platformSale'), svc: net('service') }, M = { sale: net('maintSale'), svc: net('service') };
  P.max = Math.max(P.sale, P.svc); M.max = Math.max(M.sale, M.svc);
  const rootP = -ACT.pilot.cost + P.max, rootM = -ACT.maint.cost + M.max;
  return { P, M, rootP, rootM, best: Math.max(rootP, rootM) };
}

  const E = (x1, y1, x2, y2, label, cls) => `<path class="te ${cls}" d="M${x1},${y1} C ${(x1 + x2) / 2},${y1} ${(x1 + x2) / 2},${y2} ${x2},${y2}"/><text class="el" x="${(x1 + x2) / 2}" y="${(y1 + y2) / 2 + (y2 < y1 ? -8 : 16)}" text-anchor="middle">${esc(label)}</text>`;
  const st = (solved, a, b) => !solved ? ['', ''] : [a >= b ? 'best' : 'cut', b >= a ? 'best' : 'cut'];
  const [pS, pV] = st(step >= 1, d.P.sale, d.P.svc), [mS, mV] = st(step >= 2, d.M.sale, d.M.svc), [rP, rM] = st(step >= 3, d.rootP, d.rootM);
  const leaf = (y, name, v, cls) => N(560, y, 190, name, tr('淨額 ', 'Net ') + sg(v), 'leaf ' + (cls === 'cut' ? 'dim' : ''));
  return `<div class="scroll-x"><svg class="tree" style="min-width:640px" viewBox="0 0 760 330" role="img" aria-label="${esc(tr('兩期有限決策樹', 'Two-period finite decision tree'))}">
  ${E(170, 164, 290, 74, T(ACT.pilot.short) + ' −' + ACT.pilot.cost, rP)}${E(170, 164, 290, 254, T(ACT.maint.short) + ' −' + ACT.maint.cost, rM)}

  ${leaf(10, T(ACT.platformSale.short), d.P.sale, pS)}${leaf(90, T(ACT.service.short), d.P.svc, pV)}${leaf(190, T(ACT.maintSale.short), d.M.sale, mS)}${leaf(270, T(ACT.service.short), d.M.svc, mV)}
  </svg></div>${swipe()}`;

/* 路徑試算 */
function labLoad(kind) {
  const demo = [['data', 'talent'], ['pilot', 'listen'], ['platformSale', 'coop', 'service']];
  const src = kind === 'demo' ? demo : kind === 'empty' ? [[], [], []] : state.records.length === 3 ? picks() : [[], [], []];
  ui.lab = { world: (ui.lab && ui.lab.world) || state.world, picks: src.map(p => [...p]) };
}
function labNormalize() {
  const L = ui.lab, sim = startSim();
  for (let i = 0; i < 3; i++) {
    mature(sim, i + 1);
    L.picks[i] = L.picks[i].filter(id => !eligible(ACT[id], sim));
    if (check(L.picks[i], sim)) break;
    execute(sim, L.picks[i], i + 1, L.world);
  }
}
function labHTML() {
  if (!ui.lab) labLoad(state.records.length === 3 ? 'mine' : 'demo');
  const L = ui.lab, sim = startSim(), cols = [], sep = tr('、', ', '); let dead = false;
  for (let i = 0; i < 3; i++) {
    mature(sim, i + 1);
    if (dead) { cols.push({ dead: true }); continue; }
    const start = clone(sim), err = check(L.picks[i], sim), t = totals(L.picks[i]);
    let x = null; if (err) dead = true; else x = execute(sim, L.picks[i], i + 1, L.world);
    cols.push({ start, err, t, x });
  }
  const res = trySimulate(L.picks, L.world), mine = state.records.length === 3 ? trySimulate(picks(), L.world) : null;
  const series = [];
  if (mine) series.push({ name: tr('你們的原路徑', 'Your original path'), color: '#A9B7CC', shape: 1, wide: true, values: [START_CASH, ...mine.ledger.map(l => l.after.cash)], fail: mine.failAt });
  series.push({ name: tr('試算路徑', 'Lab path'), color: W[L.world].color, shape: 0, values: [START_CASH, ...res.ledger.map(l => l.after.cash)], fail: res.failAt });
  const ext = res.failAt ? null : bestExtension(res.sim, L.world);
  return `<div class="toolbar"><span class="seg" role="group" aria-label="${tr('情境', 'Scenario')}">${WORLD_IDS.map(id => `<button type="button" data-act="labWorld" data-id="${id}" aria-pressed="${L.world === id}">${esc(T(W[id].n))}</button>`).join('')}</span>
    ${state.records.length === 3 ? `<button type="button" class="btn small" data-act="labLoad" data-id="mine">${tr('載入我們的路徑', 'Load our path')}</button>` : ''}<button type="button" class="btn small" data-act="labLoad" data-id="demo">${tr('載入教師示範路徑', 'Load the teacher’s demo path')}</button><button type="button" class="btn small" data-act="labLoad" data-id="empty">${tr('清空', 'Clear')}</button></div>
  <div class="lab-grid" style="margin-top:12px">${cols.map((c, i) => c.dead ? `<div class="lab-col dead"><h4>${YEARS[i]}</h4><p class="lab-sum">${tr('前一回合不可行，這一回合無法進行。', 'The previous round is infeasible, so this round cannot proceed.')}</p></div>` : `<div class="lab-col"><h4>${YEARS[i]}<small>${tr('可用現金 ', 'Cash ') + c.start.cash}</small></h4>
      <div class="lab-chips">${A.map(a => { const lock = eligible(a, c.start), on = L.picks[i].includes(a.id); return `<button type="button" data-act="labPick" data-r="${i}" data-id="${a.id}" aria-pressed="${on}"${lock ? ' disabled' : ''} title="${esc(lock || T(a.name) + tr('｜現金 ', ' | cash ') + a.cost + tr('、人力 ', ', engineering units ') + a.eng)}">${esc(T(a.short))}</button>`; }).join('')}</div>
      <p class="lab-sum${c.err ? ' err' : ''}">${c.err ? esc(c.err) : tr('投入 ', 'Spending ') + c.t.cost + tr('、人力 ', ', engineering units ') + c.t.eng + ' / ' + ENG_CAP + tr('；回合末現金 ', '; round-end cash ') + c.x.after.cash}</p></div>`).join('')}</div>
  <div class="grid2" style="margin-top:12px"><div class="fig"><h3>${tr('回合末現金｜', 'Round-end cash | ') + esc(T(W[L.world].n))}</h3>${cashLine(series, { minW: 440, label: tr('試算路徑的回合末現金', 'Round-end cash of the lab path') })}
    <div class="legend">${series.map(s => `<span><svg viewBox="0 0 16 16" aria-hidden="true">${marker(s.shape, 8, 8, s.color)}</svg>${esc(s.name)}</span>`).join('')}</div></div>
    <div class="fig"><h3>${tr('試算結果', 'Lab result')}</h3>${res.failAt ? `<p class="lab-sum err">${tr('第 ' + res.failAt + ' 回合不可行：', 'Infeasible in round ' + res.failAt + ': ')}${esc(res.error)}</p>` : `<p>${tr('2030 年底現金 ', 'Cash at the end of 2030: ')}<strong>${res.sim.cash}</strong>${tr('；客戶關係 ', '; client relationships: ')}<strong>${res.sim.caps.relation}</strong></p><p>${tr('2030 年底成熟能力：', 'Matured capabilities at the end of 2030: ')}${esc(capList(capsOn(res.sim)))}</p><p>${tr('2030 年投入、尚未成熟：', 'Started in 2030, not yet matured: ')}${esc(res.sim.pending.map(p => T(ACT[p.id].short)).join(sep) || tr('無', 'none'))}</p><p>${tr('2032 延伸試算的最高行動淨收入：', 'Highest net action revenue in the 2032 extension: ')}<strong>+${ext.net}</strong>${ext.ids.length ? tr('（', ' (') + esc(ext.ids.map(id => T(ACT[id].short)).join(sep)) + tr('）', ')') : ''}</p>`}
    <p class="cap">${tr('試算不會改動你們已提交的紀錄。', 'The lab never alters the rounds you have already committed.')}</p></div></div>`;
}
/* 逆向歸納 */
function treeHTML() {
  const t = ui.tree, d = treeData(t.world), sg = v => (v > 0 ? '+' : v < 0 ? '−' : '') + Math.abs(v);
  const nm = id => T(ACT[id].short), q = s => tr('「' + s + '」', '“' + s + '”');
  const pick = (a, b, an, bn) => a === b ? tr('兩者相同', 'the two are equal') : tr('選', 'choose ') + q(a > b ? an : bn);
  const add = v => (v < 0 ? ' − ' : ' + ') + Math.abs(v);
  const svc = Math.max(payoff(ACT.service, t.world) - ACT.service.cost, 0);
  const text = [
    tr('先看最右邊的四個結果：每一個的淨額（收入減成本）都已經知道，中間與最左邊的決策節點還沒有答案。', 'Start with the four outcomes on the right: each net value (revenue minus cost) is known, while the decision nodes in the middle and on the left have no answer yet.'),
    tr('平台試辦完成後，比較' + q(nm('platformSale')) + sg(d.P.sale) + ' 與' + q(nm('service')) + sg(d.P.svc) + '：' + pick(d.P.sale, d.P.svc, nm('platformSale'), nm('service')) + '，這個節點的值是 ' + sg(d.P.max) + '。', 'With the pilot complete, compare ' + q(nm('platformSale')) + ' ' + sg(d.P.sale) + ' with ' + q(nm('service')) + ' ' + sg(d.P.svc) + ': ' + pick(d.P.sale, d.P.svc, nm('platformSale'), nm('service')) + ', so this node is worth ' + sg(d.P.max) + '.'),
    tr('維修能力建立後，比較' + q(nm('maintSale')) + sg(d.M.sale) + ' 與' + q(nm('service')) + sg(d.M.svc) + '：' + pick(d.M.sale, d.M.svc, nm('maintSale'), nm('service')) + '，這個節點的值是 ' + sg(d.M.max) + '。', 'With maintenance built, compare ' + q(nm('maintSale')) + ' ' + sg(d.M.sale) + ' with ' + q(nm('service')) + ' ' + sg(d.M.svc) + ': ' + pick(d.M.sale, d.M.svc, nm('maintSale'), nm('service')) + ', so this node is worth ' + sg(d.M.max) + '.'),
    tr('把兩個結果帶回 2028 年：' + nm('pilot') + ' −' + ACT.pilot.cost + add(d.P.max) + ' = ' + sg(d.rootP) + '；' + nm('maint') + ' −' + ACT.maint.cost + add(d.M.max) + ' = ' + sg(d.rootM) + '。在這棵樹、這個已知情境下，' + pick(d.rootP, d.rootM, nm('pilot'), nm('maint')) + '。', 'Carry both results back to 2028: ' + nm('pilot') + ' −' + ACT.pilot.cost + add(d.P.max) + ' = ' + sg(d.rootP) + '; ' + nm('maint') + ' −' + ACT.maint.cost + add(d.M.max) + ' = ' + sg(d.rootM) + '. In this tree, under this known scenario, ' + pick(d.rootP, d.rootM, nm('pilot'), nm('maint')) + '.')
  ][t.step];
  return `<div class="toolbar"><span class="hint">${tr('假設已知的情境：', 'Scenario assumed known: ')}</span><span class="seg" role="group" aria-label="${tr('情境', 'Scenario')}">${WORLD_IDS.map(id => `<button type="button" data-act="treeWorld" data-id="${id}" aria-pressed="${t.world === id}">${esc(T(W[id].n))}</button>`).join('')}</span></div>
  <div class="fig" style="margin-top:12px">${treeSVG(t.world, t.step)}
    <p style="margin-top:10px" aria-live="polite"><strong>${tr('步驟 ' + (t.step + 1) + '／4　', 'Step ' + (t.step + 1) + ' of 4: ')}</strong>${esc(text)}</p>
    <div class="toolbar" style="margin-top:10px"><button type="button" class="btn primary" data-act="treeNext"${t.step >= 3 ? ' disabled' : ''}>${tr('下一步', 'Next step')}</button><button type="button" class="btn" data-act="treeReset"${t.step === 0 ? ' disabled' : ''}>${tr('重來', 'Start again')}</button></div>
    <p class="cap">${tr('逆向歸納的做法，是先在最後一層決策節點選出較好的行動，再把結果帶回前一個節點。換一個情境再解一次，答案可能不同；真實的策略還有未指定機率的不確定性、多重目標與不完整的資訊，所以這棵樹解出來的只是這棵樹的答案。主模擬中「從 2030 回推到 2026」屬於回溯規劃，和這裡的方法不同。', 'Backward induction first picks the better action at the last layer of decision nodes and then carries the result back to the node before. Solve it again under another scenario and the answer may differ; real strategy also involves uncertainty without specified probabilities, multiple goals and incomplete information, so the tree’s solution holds only for the tree. Working back from 2030 to 2026 in the main simulation is backcasting, which is a different method.')}</p>
    <p class="cap">${tr('這棵樹刻意只放兩個分支，沒有「2028 年不建構能力、2030 年只接既有客製服務」這個選項；若只看兩期現金，那個選項的淨額是 ' + sg(svc) + '，在四種情境都高於兩個分支。這個練習示範的是求解順序，不能用來判斷該不該投資。', 'The tree deliberately has only two branches and leaves out “build nothing in 2028 and serve only existing custom orders in 2030”; on two-period cash alone that option nets ' + sg(svc) + ', higher than both branches in all four scenarios. The exercise demonstrates the order of solving and cannot be used to judge whether to invest.')}</p></div>`;
}

  resetGame() {
    if (!confirm(tr('重新開始會清除這個瀏覽器裡目前的紀錄。確定已經備份並要繼續嗎？', 'Starting over clears the current entries in this browser. Have you backed up, and do you want to continue?'))) return;
    const lang = state.lang, world = state.world; state = blank(); state.lang = lang; state.world = world;
    applyHash();
    ui.reveal = 0; ui.lab = null; ui.teacherLab = false; ui.tree = { world: null, step: 0 }; go('brief');
    toast(tr('已重新開始。事件路徑為「' + W[state.world].n[0] + '」。', 'Started over. The event path is “' + W[state.world].n[1] + '.”'));
  }
};
async function copyText(text, okMsg) {
  try { await navigator.clipboard.writeText(text); toast(okMsg); }
  catch (e) {
    const ta = document.createElement('textarea'); ta.value = text; ta.setAttribute('readonly', ''); ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0';
    document.body.appendChild(ta); ta.select(); let ok = false;
    try { ok = document.execCommand('copy'); } catch (e2) { ok = false; }
    ta.remove(); toast(ok ? okMsg : tr('無法自動複製，請手動選取文字後複製。', 'Automatic copy failed; select the text and copy it manually.'), !ok);
  }
}
function download(name, type, content) {
  const u = URL.createObjectURL(new Blob([content], { type })), a = document.createElement('a');
  a.href = u; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(u), 1500);
}

/* ---------- 學習筆記 ---------- */
function notes() {
  const P = picks(), L = [], capLine = sim => [...CAP_KEYS, 'relation'].map(k => T(capLabels[k]) + ' ' + sim.caps[k]).join(tr('、', ', '));
  const quote = v => String(v).split('\n').map(l => '> ' + l).join('\n');   // 使用者輸入一律以引文呈現，避免被當成標題
  L.push('# ' + tr('第五週　規劃與策略規劃：澄川電控的三次選擇', 'Week 5 Planning and Strategic Planning: Three Choices at Chengchuan Controls'), '');
  L.push(tr('事件路徑：', 'Event path: ') + T(W[state.world].n), '');
  L.push('## ' + tr('回溯規劃', 'Backcasting'), '');
  for (const k of BRIEF_KEYS) if (state.brief[k]) L.push('### ' + T(fields[k]), quote(state.brief[k]), '');
  if (P.length) {
    const { ledger } = simulate(P, state.world);
    state.records.forEach((r, i) => {
      const x = ledger[i];
      L.push('## ' + tr('第 ' + (i + 1) + ' 回合（' + YEARS[i] + ' 年）', 'Round ' + (i + 1) + ' (' + YEARS[i] + ')'), '');
      L.push('- ' + tr('T0 行動：', 'T0 actions: ') + nameList(r.baseline.selected));
      L.push('- ' + tr('T2 行動：', 'T2 actions: ') + nameList(r.selected));
      L.push('- ' + tr('當時判斷最接近的未來：', 'Future judged closest at the time: ') + (r.baseline.belief ? T(BELIEFS[r.baseline.belief]) : tr('未填', 'not stated')));
      L.push('- ' + tr('查核方式：', 'Review mode: ') + (r.offline ? tr('教師或同儕替代查核', 'substitute review by teacher or peer') : 'AI'));
      L.push('- ' + tr('現金：回合初 ', 'Cash: opening ') + x.before.cash + tr(' − 投入 ', ' − spending ') + x.cost + tr(' + 基本營運 ', ' + base inflow ') + x.base + tr(' + 行動收入 ', ' + action revenue ') + x.revenue + tr(' − 成本壓力 ', ' − cost pressure ') + x.shock + ' = ' + x.after.cash);
      L.push('- ' + tr('工程人力：', 'Engineering units: ') + x.eng + ' / ' + ENG_CAP);
      L.push('- ' + tr('回合末能力與客戶關係：', 'Capabilities and relationships at round end: ') + capLine(x.after));
      L.push('- ' + tr('成熟中的投資：', 'Investments still maturing: ') + pendingList(x.after), '');
      for (const k of T0_KEYS) if (r.baseline.text[k]) L.push('### T0 ' + T(fields[k]), quote(r.baseline.text[k]), '');
      for (const k of ['ai', 'judgment', 'finalRationale']) if (r.text[k]) L.push('### ' + T(fields[k]), quote(r.text[k]), '');
    });
  }
  if (P.length < 3) {
    const d = state.draft;
    L.push('## ' + tr('尚未提交的草稿（第 ' + state.round + ' 回合）', 'Uncommitted draft (round ' + state.round + ')'), '');
    L.push('- ' + tr('目前勾選：', 'Currently selected: ') + nameList(d.selected));
    if (d.baseline) L.push('- ' + tr('T0 行動：', 'T0 actions: ') + nameList(d.baseline.selected));
    L.push('');
    for (const [k, v] of Object.entries({ ...(d.baseline ? d.baseline.text : {}), ...d.text })) if (own(fields, k) && v) L.push('### ' + T(fields[k]), quote(v), '');
  } else {
    L.push('## ' + tr('四情境壓力測試（行動固定，只換情境）', 'Four-scenario stress test (actions fixed, scenario swapped)'), '');
    for (const id of WORLD_IDS) {
      const res = trySimulate(P, id);
      L.push('- ' + T(W[id].n) + (id === state.world ? ' ★' : '') + COLON() + (res.failAt ? tr('第 ' + res.failAt + ' 回合不可行（', 'infeasible in round ' + res.failAt + ' (') + res.error + tr('）', ')') : tr('2030 年底現金 ', 'cash at the end of 2030 ') + res.sim.cash + tr('；2032 延伸試算 +', '; 2032 extension +') + bestExtension(res.sim, id).net));
    }
    L.push('');
  }
  for (const k of ['exit', 'cmp']) if (state.final[k]) L.push('## ' + T(fields[k]), quote(state.final[k]), '');
  return L.join('\n');
}

/* ---------- 事件 ---------- */
function selectorOf(el) {
  if (el.id) return '#' + el.id;
  const d = el.dataset;
  if (d.act) return `[data-act="${d.act}"]` + ['id', 'i', 'v', 'r'].filter(k => d[k] !== undefined).map(k => `[data-${k}="${d[k]}"]`).join('');
  return '';
}
/* 重新繪製後把鍵盤焦點放回原來的控制項；換頁時放到新頁面的標題 */
function restoreFocus(sel) {
  if (ui.focusH1) { ui.focusH1 = false; const h = document.querySelector('main h1'); if (h) h.focus({ preventScroll: true }); return; }
  if (document.activeElement && document.activeElement !== document.body) return;
  const el = sel && document.querySelector(sel);
  if (el && !el.disabled) el.focus({ preventScroll: true });
}
document.addEventListener('click', e => {
  const v = e.target.closest('[data-view]');
  if (v) { if (!v.disabled) { go(v.dataset.view); restoreFocus(''); } return; }
  const a = e.target.closest('[data-act]');
  if (a && !a.disabled && ACTIONS[a.dataset.act]) { const sel = selectorOf(a); ACTIONS[a.dataset.act](a, e); restoreFocus(sel); }
});
document.addEventListener('input', e => {
  const el = e.target;
  if (el.matches && el.matches('textarea[data-field]')) {
    (el.dataset.group === 'draft' ? state.draft.text : state[el.dataset.group])[el.dataset.field] = el.value;
    if (el.dataset.req) updateCount(el); else el.classList.remove('bad');
    clearErrs();
    save();
  }
});
document.addEventListener('change', async e => {
  const el = e.target;
  if (el.dataset && el.dataset.action) {
    const id = el.dataset.action, s = state.draft.selected;
    state.draft.selected = el.checked ? [...s.filter(x => x !== id), id] : s.filter(x => x !== id);
    clearErrs(); save(); updatePanel();
  } else if (el.id === 'offline') {
    state.draft.offline = el.checked; clearErrs();
    if (el.checked && $('f-ai')) $('f-ai').classList.remove('bad');
    save();
  } else if (el.id === 'importFile') {
    const file = el.files[0]; el.value = '';
    if (!file) return;
    let restored;
    try {
      if (file.size > 2000000) throw Error('Too large');
      restored = validateImport(JSON.parse(await file.text()));
    } catch (err) { return toast(tr('這個檔案的格式或回合紀錄不符合規則，原有的紀錄沒有變動。', 'This file’s format or round history is invalid. Your existing entries are unchanged.'), true); }
    if (!confirm(tr('還原會取代目前的紀錄。確定已經備份並要繼續嗎？', 'Restoring replaces the current entries. Have you backed up, and do you want to continue?'))) return;
    const prev = state, prevUi = { reveal: ui.reveal, lab: ui.lab, tree: ui.tree };
    try {
      state = restored; ui.reveal = 0; ui.lab = null; ui.tree = { world: null, step: 0 }; render(); window.scrollTo(0, 0);
      toast(tr('紀錄已還原。', 'Entries restored.'));
    } catch (err) {
      state = prev; Object.assign(ui, prevUi); render();
      toast(tr('這個檔案無法顯示，原有的紀錄沒有變動。', 'This file could not be displayed. Your existing entries are unchanged.'), true);
    }
  }
});
$('langBtn').addEventListener('click', () => { state.lang = state.lang === 'zh' ? 'en' : 'zh'; syncHash(); keepScroll(render); });
/* 同一份連結在開始前才生效；已開始時只提醒 */
window.addEventListener('hashchange', () => {
  const r = applyHash();
  if (r === 'yes') { ui.lab = null; keepScroll(render); toast(tr('已依連結設定事件路徑為「' + W[state.world].n[0] + '」。', 'Event path set from the link: “' + W[state.world].n[1] + '.”')); }
  else if (r === 'locked') toast(tr('模擬已經開始，連結中的事件路徑沒有套用。', 'The simulation has started, so the event path in the link was not applied.'), true);
});
/* 另一個分頁寫入紀錄時同步，避免舊分頁覆蓋新進度 */
window.addEventListener('storage', e => {
  if (e.key !== KEY || !e.newValue || e.newValue === JSON.stringify(state)) return;
  try {
    const s = validateImport(JSON.parse(e.newValue)), view = state.view;
    s.lang = state.lang; s.view = view;
    state = s; ui.reveal = 0; ui.lab = null; render();
    toast(tr('另一個分頁更新了紀錄，這個分頁已同步為最新內容。', 'Another tab updated the entries; this tab now shows the latest version.'));
  } catch (err) { /* 另一個分頁寫入的內容無法讀取時，維持現狀 */ }
});
/* 圖表提示框 */
(() => {
  const box = $('tip');
  const show = el => { box.textContent = el.dataset.tip; const r = el.getBoundingClientRect(); box.classList.add('on'); const w = box.offsetWidth, h = box.offsetHeight; let x = r.left + r.width / 2 - w / 2, y = r.top - h - 8; x = Math.max(8, Math.min(x, innerWidth - w - 8)); if (y < 8) y = r.bottom + 8; box.style.left = x + 'px'; box.style.top = y + 'px'; };
  const hide = () => box.classList.remove('on');
  document.addEventListener('pointerover', e => { const el = e.target.closest && e.target.closest('[data-tip]'); if (el) show(el); else hide(); });
  document.addEventListener('focusin', e => { const el = e.target.closest && e.target.closest('[data-tip]'); if (el) show(el); });
  document.addEventListener('focusout', hide);
  document.addEventListener('scroll', hide, { passive: true });
})();

load();
render();
if (ui.loadFailed) toast(tr('先前保存的紀錄無法讀取，已另外留存一份並從頭開始。若有 JSON 備份，請用「還原 JSON 備份」。', 'The previously saved entries could not be read; a copy was kept aside and the page started fresh. If you have a JSON backup, use “Restore JSON backup.”'), true);
</script>
</body>
